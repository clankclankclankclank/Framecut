format = 2

[effect]
id = "concat.screen-print"
name = "Screen Print"
kind = "effect"
category = "Stylize"
order = 170
description = "Translate luminance into angled ink dots over warm paper."
intensity = "amount"

[[param]]
key = "amount"
label = "Amount"
min = 0
max = 100
default = 85
step = 1
unit = "%"

[[param]]
key = "pitch"
label = "Pitch"
min = 4
max = 40
default = 12
step = 1
unit = "px"

[[param]]
key = "angle"
label = "Angle"
min = -180
max = 180
default = 35
step = 1
unit = "°"

[wgsl]
entry = "effect.wgsl"
