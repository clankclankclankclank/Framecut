[[probe]]
name = "Zero amount preserves straight colour and alpha"
params = { amount = 0 }
input = [0.12, 0.4, 0.75, 0.6]
expect = [0.12, 0.4, 0.75, 0.6]

[[probe]]
name = "White emits a full bloom at the default threshold"
input = [1, 1, 1, 1]
expect = [1.55, 1.55, 1.55, 1]
